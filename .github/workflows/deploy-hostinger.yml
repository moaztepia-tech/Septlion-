name: Deploy Septlion to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: septlion-production
  cancel-in-progress: false

jobs:
  smart_need:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[smart-need-only]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout approved smart-need patch only
        uses: actions/checkout@v4
        with:
          ref: dded8f4f45fcf776d21a6c4c48015d4eb4f76d1a
          persist-credentials: false
      - name: Install protected FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Download existing Hostinger index.html
        env:
          H_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          H_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          H_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$H_SERVER" && test -n "$H_USER" && test -n "$H_PASS"
          # Hostinger's FTP_IP presents a CA-valid certificate for the server hostname rather than the IP.
          # Pin the observed server certificate before allowing that documented hostname exception.
          fp=$(timeout 20 openssl s_client -starttls ftp -connect "$H_SERVER:21" -showcerts </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | sed 's/.*=//')
          if [ "$fp" != 'D5:F8:12:83:AA:BE:1E:92:51:FF:84:B3:A5:65:D6:51:91:C9:A5:28' ]; then
            echo 'SAFETY STOP: FTP TLS certificate fingerprint is not the previously verified Hostinger certificate.'
            exit 1
          fi
          lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set net:max-retries 2; cd /domains/septlion.com/public_html/; get index.html -o /tmp/septlion-index-before.html; bye'
          test -s /tmp/septlion-index-before.html
      - name: Refuse to overwrite a different live website; patch only composer
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          original = Path('/tmp/septlion-index-before.html').read_bytes()
          sha = hashlib.sha256(original).hexdigest()
          approved = '7ba34af28b30d130c447562ac1d10fdc280e8f27bf2c95de3062440f063eac9b'
          if sha != approved:
              raise SystemExit('SAFETY STOP: Live index.html differs from approved Oct 31 file. SHA256=' + sha + '; no change made.')
          text = original.decode('utf-8')
          start = 'function send(text){'
          end = "input.addEventListener('keydown'"
          if text.count(start) != 1 or text.count(end) != 1 or text.count('function proceedCard(){') != 1:
              raise SystemExit('SAFETY STOP: composer markers are not unique')
          a = text.index(start)
          b = text.index(end, a)
          previous = text[a:b]
          if "addMsg(t,'user')" not in previous or "stage='ready'" not in previous:
              raise SystemExit('SAFETY STOP: existing composer not recognized')
          patched_send = Path('scripts/smart-need-send.js').read_text('utf-8')
          updated = text[:a] + previous.replace(start, 'function legacySend(text){', 1) + '\n' + patched_send + '\n' + text[b:]
          expected = '7c54fa192dad637ca37c6311666955f9f40fc0dfe87e574063cec1e8ff7ef4e8'
          actual = hashlib.sha256(updated.encode('utf-8')).hexdigest()
          if actual != expected:
              raise SystemExit('SAFETY STOP: generated HTML differs from exact user-approved patch ' + actual)
          Path('/tmp/septlion-index-next.html').write_bytes(updated.encode('utf-8'))
          print('Verified exact approved website and exact single-function enhancement.')
          PY
      - name: Back up live index for one-file rollback
        uses: actions/upload-artifact@v4
        with:
          name: septlion-index-before-smart-need
          path: /tmp/septlion-index-before.html
          retention-days: 14
      - name: Upload only index.html and read it back
        env:
          H_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          H_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          H_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set net:max-retries 2; cd /domains/septlion.com/public_html/; put /tmp/septlion-index-next.html -o index.html; get index.html -o /tmp/septlion-index-verified.html; bye'
          if ! cmp -s /tmp/septlion-index-next.html /tmp/septlion-index-verified.html; then
            echo "Verification failed. Restoring original site."
            lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set ftp:ssl-force yes; set ftp:ssl-protect-data yes; cd /domains/septlion.com/public_html/; put /tmp/septlion-index-before.html -o index.html; bye'
            exit 1
          fi
          echo 'PASS: only the live index.html updated; remote file read-back matches exact approved smart need HTML.'
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[smart-need-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build website
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jfbmxowdmfdzyoauqgwn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_u6QtC_XIPHKn08EuWosI4g_DL8DdgbD
        run: pnpm --filter @septlion/web build

      - name: Prepare static deployment
        run: |
          rm -rf deploy
          mkdir -p deploy/_next deploy/discover deploy/maritime-rfq deploy/demand-intelligence deploy/demand-intelligence/workbench deploy/intent/wheat-flour deploy/intent/demand deploy/require
          cp apps/web/.next/server/app/index.html deploy/index.html
          cp apps/web/.next/server/app/index.html deploy/404.html
          DISCOVER_HTML="$(find apps/web/.next/server/app -type f -path '*/discover.html' | head -n 1)"
          test -n "$DISCOVER_HTML"
          cp "$DISCOVER_HTML" deploy/discover/index.html
          test -s deploy/discover/index.html
          mkdir -p deploy/requests
          REQUESTS_HTML="$(find apps/web/.next/server/app -type f -path '*/requests.html' | head -n 1)"
          test -n "$REQUESTS_HTML"
          cp "$REQUESTS_HTML" deploy/requests/index.html
          test -s deploy/requests/index.html
          mkdir -p deploy/request
          REQUEST_HTML="$(find apps/web/.next/server/app -type f -path '*/request.html' | head -n 1)"
          test -n "$REQUEST_HTML"
          cp "$REQUEST_HTML" deploy/request/index.html
          test -s deploy/request/index.html
          mkdir -p deploy/offer
          OFFER_HTML="$(find apps/web/.next/server/app -type f -path '*/offer.html' | head -n 1)"
          test -n "$OFFER_HTML"
          cp "$OFFER_HTML" deploy/offer/index.html
          test -s deploy/offer/index.html
          mkdir -p deploy/offer-document
          OFFER_DOCUMENT_HTML="$(find apps/web/.next/server/app -type f -path '*/offer-document.html' | head -n 1)"
          test -n "$OFFER_DOCUMENT_HTML"
          cp "$OFFER_DOCUMENT_HTML" deploy/offer-document/index.html
          test -s deploy/offer-document/index.html
          mkdir -p deploy/commit
          COMMIT_HTML="$(find apps/web/.next/server/app -type f -path '*/commit.html' | head -n 1)"
          test -n "$COMMIT_HTML"
          cp "$COMMIT_HTML" deploy/commit/index.html
          test -s deploy/commit/index.html
          mkdir -p deploy/execution
          EXECUTION_HTML="$(find apps/web/.next/server/app -type f -path '*/execution.html' | head -n 1)"
          test -n "$EXECUTION_HTML"
          cp "$EXECUTION_HTML" deploy/execution/index.html
          test -s deploy/execution/index.html
          mkdir -p deploy/receive
          RECEIVE_HTML="$(find apps/web/.next/server/app -type f -path '*/receive.html' | head -n 1)"
          test -n "$RECEIVE_HTML"
          cp "$RECEIVE_HTML" deploy/receive/index.html
          test -s deploy/receive/index.html
          mkdir -p deploy/reorder
          REORDER_HTML="$(find apps/web/.next/server/app -type f -path '*/reorder.html' | head -n 1)"
          test -n "$REORDER_HTML"
          cp "$REORDER_HTML" deploy/reorder/index.html
          test -s deploy/reorder/index.html
          mkdir -p deploy/notifications
          NOTIFICATIONS_HTML="$(find apps/web/.next/server/app -type f -path '*/notifications.html' | head -n 1)"
          test -n "$NOTIFICATIONS_HTML"
          cp "$NOTIFICATIONS_HTML" deploy/notifications/index.html
          test -s deploy/notifications/index.html
          mkdir -p deploy/account
          ACCOUNT_HTML="$(find apps/web/.next/server/app -type f -path '*/account.html' | head -n 1)"
          test -n "$ACCOUNT_HTML"
          cp "$ACCOUNT_HTML" deploy/account/index.html
          test -s deploy/account/index.html
          mkdir -p deploy/operations
          OPERATIONS_HTML="$(find apps/web/.next/server/app -type f -path '*/operations.html' | head -n 1)"
          test -n "$OPERATIONS_HTML"
          cp "$OPERATIONS_HTML" deploy/operations/index.html
          test -s deploy/operations/index.html
          mkdir -p deploy/analytics
          ANALYTICS_HTML="$(find apps/web/.next/server/app -type f -path '*/analytics.html' | head -n 1)"
          test -n "$ANALYTICS_HTML"
          cp "$ANALYTICS_HTML" deploy/analytics/index.html
          test -s deploy/analytics/index.html
          mkdir -p deploy/documents
          DOCUMENTS_HTML="$(find apps/web/.next/server/app -type f -path '*/documents.html' | head -n 1)"
          test -n "$DOCUMENTS_HTML"
          cp "$DOCUMENTS_HTML" deploy/documents/index.html
          test -s deploy/documents/index.html
          cp apps/web/.next/server/app/maritime-rfq.html deploy/maritime-rfq/index.html
          if [ -f apps/web/.next/server/app/demand-intelligence.html ]; then cp apps/web/.next/server/app/demand-intelligence.html deploy/demand-intelligence/index.html; fi
          if [ -f apps/web/.next/server/app/demand-intelligence/workbench.html ]; then cp apps/web/.next/server/app/demand-intelligence/workbench.html deploy/demand-intelligence/workbench/index.html; fi
          REQUIRE_HTML="$(find apps/web/.next/server/app -type f -path '*/require.html' | head -n 1)"
          test -n "$REQUIRE_HTML"
          cp "$REQUIRE_HTML" deploy/require/index.html
          test -s deploy/require/index.html
          test -s deploy/operations/index.html
          test -s deploy/analytics/index.html
          if [ -f apps/web/.next/server/app/intent/wheat-flour.html ]; then cp apps/web/.next/server/app/intent/wheat-flour.html deploy/intent/wheat-flour/index.html; fi
          if [ -f apps/web/.next/server/app/intent/demand.html ]; then cp apps/web/.next/server/app/intent/demand.html deploy/intent/demand/index.html; fi
          cp -R apps/web/.next/static deploy/_next/static
          if [ -d apps/web/public ]; then cp -R apps/web/public/. deploy/; fi
          if [ -f apps/web/.next/server/app/robots.txt.body ]; then cp apps/web/.next/server/app/robots.txt.body deploy/robots.txt; fi
          if [ -f apps/web/.next/server/app/sitemap.xml.body ]; then cp apps/web/.next/server/app/sitemap.xml.body deploy/sitemap.xml; fi
          if [ -f apps/web/.next/server/app/llms.txt.body ]; then cp apps/web/.next/server/app/llms.txt.body deploy/llms.txt; fi
          echo "Deployment files verified"
          test -s deploy/index.html
          test -s deploy/require/index.html

      - name: Generate live demand SEO pages
        run: node scripts/generate-demand-pages.mjs

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/
          server-dir: /domains/septlion.com/public_html/
          # Preserve the live files while publishing the next build.
          dangerous-clean-slate: false

# deployment trigger: production-route-republish-2026-10-04

