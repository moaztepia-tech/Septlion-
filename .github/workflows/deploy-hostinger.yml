name: Deploy Septlion to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: septlion-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify customer workflows
        run: node --test tests/*.test.mjs

      - name: Typecheck website
        run: pnpm --filter @septlion/web typecheck

      - name: Build website
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jfbmxowdmfdzyoauqgwn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_u6QtC_XIPHKn08EuWosI4g_DL8DdgbD
        run: pnpm --filter @septlion/web build

      - name: Prepare static deployment
        run: node scripts/hostinger-production.mjs

      - name: Generate live demand SEO pages
        run: node scripts/generate-demand-pages.mjs

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/
          server-dir: /domains/septlion.com/public_html/
          # Preserve the live files while publishing the next build.
          dangerous-clean-slate: false

# deployment trigger: production-route-republish-2026-10-04


      - name: Verify deployed production build
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://septlion.com';
          const response = await fetch(base + '/deployment.json?commit=' + process.env.EXPECTED_COMMIT);
          if (!response.ok) throw new Error('Deployment marker returned ' + response.status);
          const deployed = await response.json();
          if (deployed.commit !== process.env.EXPECTED_COMMIT || deployed.basePath !== '') throw new Error('Hostinger is serving a different build.');
          for (const route of ['/', '/discover/', '/require/', '/account/']) {
            const page = await fetch(base + route);
            if (!page.ok || !(await page.text()).includes('/_next/')) throw new Error('Production route failed: ' + route);
          }
          const rsc = await fetch(base + '/require/?_rsc=release', {headers: {RSC: '1'}});
          if (!rsc.ok || !(rsc.headers.get('content-type') || '').includes('text/x-component') || (await rsc.text()).startsWith('<!DOCTYPE')) throw new Error('Production client navigation failed.');
          console.log('Verified production deployment: ' + deployed.commit);
          NODE
