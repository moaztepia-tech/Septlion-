name: Deploy Septlion to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: septlion-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: hostinger-deploy
          path: publish

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: publish/
          server-dir: domains/septlion.com/public_html/
