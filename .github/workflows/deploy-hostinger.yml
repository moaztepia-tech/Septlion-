name: Deploy Septlion to Hostinger
# Deploy through the primary Hostinger FTP account

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: septlion-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: hostinger-deploy
          path: publish

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: publish/
          server-dir: /domains/septlion.com/public_html/

      - name: Fix Hostinger permissions
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib, os
          ftp = ftplib.FTP_TLS()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=20)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.prot_p()
          ftp.cwd("/domains/septlion.com/public_html")
          for name in ["index.html", "404.html", "robots.txt", "sitemap.xml", "llms.txt", "index.txt"]:
              try:
                  ftp.sendcmd(f"SITE CHMOD 644 {name}")
              except ftplib.all_errors:
                  pass
          try:
              ftp.sendcmd("SITE CHMOD 755 _next")
          except ftplib.all_errors:
              pass
          ftp.quit()
          PY
