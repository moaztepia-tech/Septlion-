name: Deploy Septlion to Hostinger

# The only path that changes www.septlion.com. Manual start only; see docs/DEPLOY.md.
#   1. mode=plan      builds the package and shows which live files would be replaced. Changes nothing.
#   2. mode=publish   with the plan_id from step 1: backup of touched files (all with full_scan), upload, read-back, public check, auto-restore.
#   3. mode=rollback  restores a backup made by an earlier publish (latest if backup_name is empty).
# Nothing is ever deleted on the server.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan, publish or rollback
        type: choice
        options: [plan, publish, rollback]
        default: plan
      site:
        description: "nextjs = the platform in apps/web; approved-client = the archived live client in sites/approved-client; customer-client = the new-app interface at / that sends requests to the platform (sites/customer-client)"
        type: choice
        options: [nextjs, approved-client, customer-client]
        default: nextjs
      plan_id:
        description: "publish only: the plan id printed by the plan run"
        type: string
        default: ""
      backup_name:
        description: "rollback only: backup to restore (empty = latest)"
        type: string
        default: ""
      full_scan:
        description: "Scan and back up all of public_html (slow, ~10-20 min). Off = only the files in the package (fast, same plan id)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: septlion-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Release script tests
        run: python3 -m unittest discover -s tests -p 'hostinger_release_test.py'

      - name: Setup pnpm
        if: inputs.mode != 'rollback' && inputs.site == 'nextjs'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        if: inputs.mode != 'rollback' && inputs.site == 'nextjs'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install, test and build the platform
        if: inputs.mode != 'rollback' && inputs.site == 'nextjs'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jfbmxowdmfdzyoauqgwn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_u6QtC_XIPHKn08EuWosI4g_DL8DdgbD
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
          pnpm test
          pnpm --filter @septlion/web build
          if test -f apps/web/.next/server/app/api/command-session/route.js; then
            echo "Server authorization requires a Node.js runtime. Static Hostinger deployment is blocked." >&2
            exit 1
          fi
          node scripts/hostinger-production.mjs
          node scripts/generate-demand-pages.mjs

      - name: Package the archived live client
        if: inputs.mode != 'rollback' && inputs.site == 'approved-client'
        run: |
          node --test sites/approved-client/intake.test.cjs
          python3 scripts/package-approved-client.py deploy

      - name: Package the customer client
        if: inputs.mode != 'rollback' && inputs.site == 'customer-client'
        run: |
          node --test sites/customer-client/bridge.test.cjs
          python3 scripts/package-customer-client.py deploy

      - name: Run release (${{ inputs.mode }})
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          PLAN_ID: ${{ inputs.plan_id }}
          BACKUP_NAME: ${{ inputs.backup_name }}
          FULL_SCAN: ${{ inputs.full_scan }}
        run: |
          extra=""
          if [ "$FULL_SCAN" = "true" ]; then extra="--full"; fi
          python3 scripts/hostinger-release.py "$MODE" --package deploy --plan-id "$PLAN_ID" --backup-name "$BACKUP_NAME" --out release-backup $extra

      - name: Keep backups and plan as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: septlion-${{ inputs.mode }}-${{ inputs.site }}-${{ github.run_id }}
          path: release-backup/
          if-no-files-found: ignore
          retention-days: 90
