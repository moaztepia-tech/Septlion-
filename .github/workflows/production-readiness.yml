name: Production Readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/production-readiness.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma format check
        working-directory: apps/api
        run: pnpm exec prisma format --check || (pnpm exec prisma format && git diff -- prisma/schema.prisma && exit 1)
        env:
          DATABASE_URL: postgresql://septlion:septlion@localhost:5432/septlion
      - name: Prisma validate
        working-directory: apps/api
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://septlion:septlion@localhost:5432/septlion
      - name: Prisma generate
        working-directory: apps/api
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://septlion:septlion@localhost:5432/septlion
      - name: Web typecheck
        run: pnpm --filter @septlion/web typecheck
      - name: Web production build
        run: pnpm --filter @septlion/web build
      - name: Verify critical production route prerenders
        run: |
          set -euo pipefail
          test -s apps/web/.next/server/app/index.html
          for route in discover require requests account notifications documents operations analytics request offer commit execution receive reorder maritime-rfq demand-intelligence; do
            test -s "apps/web/.next/server/app/$route.html"
          done
