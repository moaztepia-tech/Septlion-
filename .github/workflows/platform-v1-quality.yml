name: Platform V1 Quality Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce Edge-only production runtime
        run: |
          ! grep -R -n -E "NEXT_PUBLIC_API_URL|localhost:4000|from ['\"]\.\.?/.*/api['\"].*\bapi\b" apps/web --include='*.ts' --include='*.tsx'
          test ! -d apps/web/app/api/demand-intelligence
      - name: Typecheck web
        run: pnpm --filter @septlion/web typecheck
      - name: Build web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jfbmxowdmfdzyoauqgwn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_u6QtC_XIPHKn08EuWosI4g_DL8DdgbD
        run: pnpm --filter @septlion/web build
