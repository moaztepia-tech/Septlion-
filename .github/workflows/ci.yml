name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: septlion
          POSTGRES_PASSWORD: septlion
          POSTGRES_DB: septlion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U septlion -d septlion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma validate
        working-directory: apps/api
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://septlion:septlion@localhost:5432/septlion
      - name: Verify schema can bootstrap an isolated core database
        working-directory: apps/api
        run: |
          pnpm exec prisma db push --skip-generate
          test "$(psql "postgresql://septlion:septlion@localhost:5432/septlion" -Atc "select count(*) from information_schema.tables where table_schema='core' and table_type='BASE TABLE'")" -gt 0
        env:
          DATABASE_URL: postgresql://septlion:septlion@localhost:5432/septlion?schema=core
      - name: Generate production baseline SQL
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/septlion-core-baseline.sql
          echo "SEPTLION_BASELINE_BEGIN"
          cat /tmp/septlion-core-baseline.sql
          echo "SEPTLION_BASELINE_END"
      - name: Prisma generate
        working-directory: apps/api
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://septlion:septlion@localhost:5432/septlion
      - run: pnpm typecheck
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://septlion:septlion@localhost:5432/septlion
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
