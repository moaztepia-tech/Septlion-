name: SEPTLION diagnose browser vs ChatGPT link versions
on:
  push:
    branches: [test/diagnose-site-variants-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/diagnose-live-site-variants.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-variant-proof
          path: test-results/variant-audit/
          retention-days: 7
