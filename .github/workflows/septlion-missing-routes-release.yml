name: SEPTLION missing customer routes only
on:
  push:
    branches: [release/hostinger-missing-routes-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: septlion-hostinger-partial-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact release
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test existing flow and route packaging
        run: |
          pnpm test
          pnpm --filter @septlion/web typecheck
      - name: Back up and fingerprint live homepage through protected FTPS
        env:
          H_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          H_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          H_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          test -n "$H_SERVER" && test -n "$H_USER" && test -n "$H_PASS"
          fp=$(timeout 20 openssl s_client -starttls ftp -connect "$H_SERVER:21" -showcerts </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | sed 's/.*=//')
          if [ "$fp" != 'D5:F8:12:83:AA:BE:1E:92:51:FF:84:B3:A5:65:D6:51:91:C9:A5:28' ]; then
            echo 'FTPS server certificate fingerprint has changed; stop instead of risking a wrong server.'
            exit 1
          fi
          lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set net:max-retries 2; cd /domains/septlion.com/public_html/; get index.html -o /tmp/septlion-index-before.html; bye'
          test -s /tmp/septlion-index-before.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          before=Path('/tmp/septlion-index-before.html').read_bytes()
          assert b'SEPTLION' in before, 'Unexpected homepage backup'
          print('Original homepage sha256:',hashlib.sha256(before).hexdigest())
          PY
      - name: Keep original homepage rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: septlion-approved-homepage-before-routes
          path: /tmp/septlion-index-before.html
          retention-days: 14
      - name: Build existing platform routes
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jfbmxowdmfdzyoauqgwn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_u6QtC_XIPHKn08EuWosI4g_DL8DdgbD
        run: pnpm --filter @septlion/web build
      - name: Package ONLY the two missing routes and matching Next assets
        run: |
          set -euo pipefail
          mkdir -p deploy-missing-routes/review deploy-missing-routes/my-septlion deploy-missing-routes/_rsc deploy-missing-routes/_next
          for route in review my-septlion; do
            test -s "apps/web/.next/server/app/${route}.html"
            test -s "apps/web/.next/server/app/${route}.rsc"
            cp "apps/web/.next/server/app/${route}.html" "deploy-missing-routes/${route}/index.html"
            cp "apps/web/.next/server/app/${route}.rsc" "deploy-missing-routes/_rsc/${route}.rsc"
            grep -q '/_next/' "deploy-missing-routes/${route}/index.html"
          done
          cp -R apps/web/.next/static deploy-missing-routes/_next/static
          test ! -e deploy-missing-routes/index.html
          test ! -e deploy-missing-routes/404.html
          test ! -e deploy-missing-routes/.htaccess
          test ! -e deploy-missing-routes/intake.js
          find deploy-missing-routes -type f | head -30
      - name: Upload missing routes through verified FTPS (single connection, no deletion)
        env:
          H_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          H_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          H_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test ! -e deploy-missing-routes/index.html
          test ! -e deploy-missing-routes/404.html
          test ! -e deploy-missing-routes/.htaccess
          test ! -e deploy-missing-routes/intake.js
          lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set net:max-retries 2; set net:timeout 25; mirror -R --parallel=1 --only-newer --no-perms deploy-missing-routes /domains/septlion.com/public_html/; bye'
      - name: Verify exact uploaded files and homepage over FTPS
        env:
          H_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          H_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          H_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set net:max-retries 2; cd /domains/septlion.com/public_html/; get index.html -o /tmp/septlion-index-after.html; get review/index.html -o /tmp/septlion-review-after.html; get my-septlion/index.html -o /tmp/septlion-my-septlion-after.html; bye'
          cmp -s /tmp/septlion-index-before.html /tmp/septlion-index-after.html || { echo 'SAFETY ERROR: homepage changed'; exit 1; }
          cmp -s deploy-missing-routes/review/index.html /tmp/septlion-review-after.html
          cmp -s deploy-missing-routes/my-septlion/index.html /tmp/septlion-my-septlion-after.html
          echo 'PASS: Both missing routes are present byte-for-byte; original homepage is unchanged.'
