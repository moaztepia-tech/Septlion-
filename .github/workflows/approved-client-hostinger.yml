name: Publish approved SEPTLION client to Hostinger

on:
  push:
    branches: [deploy/approved-client-20261101]
    paths:
      - .github/workflows/approved-client-hostinger.yml
      - scripts/publish-approved-client.py
      - tests/approved-client-intake.test.cjs
      - deploy/approved-client-manifest.json
      - deploy/approved-client.tar.gz.b64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: septlion-production
  cancel-in-progress: false

jobs:
  publish-approved-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unpack and validate the exact approved client files
        run: python3 scripts/publish-approved-client.py prepare

      - name: Check client JavaScript syntax
        run: |
          node - <<'JS'
          const fs = require('fs'), vm = require('vm');
          const html = fs.readFileSync('release-output/index.html', 'utf8');
          for (const match of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)) {
            if (!/application\/json/.test(match[1])) new vm.Script(match[2]);
          }
          new vm.Script(fs.readFileSync('release-output/intake.js', 'utf8'));
          console.log('Approved client JavaScript syntax passed');
          JS

      - name: Verify Arabic intake behavior
        run: node --test tests/approved-client-intake.test.cjs

      - name: Back up target files and publish using existing Hostinger FTPS credentials
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: python3 scripts/publish-approved-client.py publish

      - name: Verify the public domain serves the approved files
        run: |
          python3 -m venv .release-verify
          .release-verify/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0
          .release-verify/bin/python scripts/publish-approved-client.py verify

      - name: Retain the previous versions of replaced files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: septlion-before-approved-client-${{ github.run_id }}
          path: release-backup/
          if-no-files-found: ignore
          retention-days: 14
