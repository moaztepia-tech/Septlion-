name: SEPTLION approved homepage operational handoff
on:
  push:
    branches: [release/approved-homepage-real-handoff-20261103]
permissions:
  contents: read
concurrency:
  group: septlion-approved-homepage-index
  cancel-in-progress: false
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare trusted FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Download and verify original approved homepage
        env:
          H_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          H_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          H_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$H_SERVER" && test -n "$H_USER" && test -n "$H_PASS"
          fp=$(timeout 20 openssl s_client -starttls ftp -connect "$H_SERVER:21" -showcerts </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | sed 's/.*=//')
          test "$fp" = 'D5:F8:12:83:AA:BE:1E:92:51:FF:84:B3:A5:65:D6:51:91:C9:A5:28'
          lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set cmd:fail-exit yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set net:max-retries 2; cd /domains/septlion.com/public_html/; get index.html -o /tmp/septlion-index-before.html; bye'
          sha256sum /tmp/septlion-index-before.html
          test "$(sha256sum /tmp/septlion-index-before.html | cut -d' ' -f1)" = "7cae91d2f051aa0656fce02ef0cfea44423b1099235761418a67c72ceec39bc9"
      - name: Keep exact original homepage rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: septlion-index-before-authenticated-handoff
          path: /tmp/septlion-index-before.html
          retention-days: 21
      - name: Patch only demo submission and validate JavaScript
        run: |
          set -euo pipefail
          python3 scripts/patch-approved-handoff.py /tmp/septlion-index-before.html /tmp/septlion-index-next.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          original=Path('/tmp/septlion-index-before.html').read_text('utf-8')
          patched=Path('/tmp/septlion-index-next.html').read_text('utf-8')
          assert original.count('<script')==patched.count('<script')
          assert original.count('<style')==patched.count('<style')
          assert original.count('lg-sym')==patched.count('lg-sym')
          assert "store.set(REQ_KEY,list)" in original
          assert patched.count("window.location.assign('/require/')")==2
          assert "window.location.assign('/my-septlion/')" in patched
          code=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',patched,re.S)
          assert code and len(code[-1])>10000,'Main embedded script not found'
          Path('/tmp/septlion-inline.js').write_text(code[-1],encoding='utf-8')
          PY
          node --check /tmp/septlion-inline.js
          echo "PASS: approved logo and styles preserved; script parses and RFQs hand off to verified route."
      - name: Publish only approved homepage index and check exact remote file
        env:
          H_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          H_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          H_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if ! lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set cmd:fail-exit yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set net:max-retries 2; cd /domains/septlion.com/public_html/; put /tmp/septlion-index-next.html -o index.html; get index.html -o /tmp/septlion-index-verified.html; bye'; then
            echo "Hostinger write/read failed, restoring the previous approved homepage."
            lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set net:max-retries 2; cd /domains/septlion.com/public_html/; put /tmp/septlion-index-before.html -o index.html; bye'
            exit 1
          fi
          if ! cmp -s /tmp/septlion-index-next.html /tmp/septlion-index-verified.html; then
            echo "Remote content mismatch; rolling back immediately."
            lftp -u "$H_USER","$H_PASS" -p 21 "ftp://$H_SERVER" -e 'set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set net:max-retries 2; cd /domains/septlion.com/public_html/; put /tmp/septlion-index-before.html -o index.html; bye'
            exit 1
          fi
          echo "PASS: original SEPTLION homepage retained, with real authenticated RFQ handoff."
