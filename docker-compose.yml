services:
  postgres:
    image: postgres:16-alpine
    container_name: septlion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: septlion
      POSTGRES_PASSWORD: septlion_dev
      POSTGRES_DB: septlion
    ports: ["5432:5432"]
    volumes: ["septlion_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U septlion -d septlion"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  septlion_pgdata:
